[system]
arcade = false
autoplay = false
playable = 3
menu_timer_seconds = 90

[window]
width = 1920
height = 1080
sizable = true
fullscreen = false
letterbox_color = "#000000"

[audio]
music_volume = 1.0
ui_sound_volume = 1.0
gameplay_sound_volume = 0.55

[input]
latency_offset_seconds = 0.0

[sync]
# Relative paths are resolved beside config.toml. Absolute paths are also supported.
# Use a dedicated directory, such as /tmp/XLAIR-sync or a folder under Downloads.
directory = "data/sheets/sync"

[controller]
mode = "keyboard" # or ground_slider, v1
highlight_touch_threshold = false

[controller.ground_slider]
port = "COM1"
baud_rate = 115200
touch_threshold = 1

[controller.v1]
port = "auto"       # auto: detect automatically / COM1 or /dev/...
baud_rate = 115200
touch_threshold = 1

[card_reader]
mode = "pasori" # or mock

[card_reader.mock]
card_id = "00000000"

[api]
mode = "http"
endpoint = "https://api.xlair.dev"
timeout_seconds = 10.0

[api.mock]
data_directory = "data/mock/api"

[api.auth]
domain = ""
client_id = ""
client_secret = ""
audience = "https://api.xlair.dev"
